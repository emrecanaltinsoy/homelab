  #      - /data:/data
  #    ports:
  #      - 5056:5055
  #    restart: unless-stopped
  #    env_file:
  #      - .env

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1000} # Change to your user ID
      - PGID=${PGID:-1000} # Change to your group ID
      - TZ=${TZ:-Europe/Madrid} # Change to your timezone
    volumes:
      - ./tautulli:/config
    ports:
      - 8181:8181
    restart: unless-stopped
