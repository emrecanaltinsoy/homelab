# Currently untested as written
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1000} # Change to your user ID
      - PGID=${PGID:-1000} # Change to your group ID
      - TZ=${TZ:-Europe/Madrid} # Change to your timezone
      - VERSION=${VERSION:-docker}
      - PLEX_CLAIM=${PLEX_CLAIM} #optional
    ports:
      - 32400:32400
    devices:
      - /dev/dri:/dev/dri # QuickSync
    volumes:
      - ./plex:/config
      - /data:/data
    restart: unless-stopped

  #  overseerr:
